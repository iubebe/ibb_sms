name: develop

# Extra check for PRs into develop: the Docker image still builds (no push).
# There is no unit-test job because this app has no test script yet.
on:
  pull_request:
    branches: [develop]

concurrency:
  group: develop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
